name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython

    - name: Accept Android Licenses & Build
      run: |
        buildozer init || true
        sed -i 's/#requirements = python3,kivy/requirements = python3,kivy/g' buildozer.spec
        sed -i 's/#package.name = myapp/package.name = atlas/g' buildozer.spec
        sed -i 's/#package.domain = org.test/package.domain = org.atlas/g' buildozer.spec
        # Android SDK lisanslarını otomatik kabul et
        mkdir -p ~/.android
        echo '### Doo not remove this file unless you want to update SDK lib licenses' > ~/.android/repositories.cfg
        yes | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
