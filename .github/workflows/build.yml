name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Sistemin İhtiyacı Olan Programları Kur
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

    - name: Python Paketlerini Kur
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython==3.0.11 virtualenv

    - name: Atlas APK Derleme İşlemi
      run: |
        # Kendi hazırladığımız buildozer.spec dosyasını kullanacak
        buildozer -v android debug

    - name: APK Dosyasını Yükle
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
